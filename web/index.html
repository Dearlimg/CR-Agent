<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Code Review Agent</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:14px system-ui}.app{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 8px 30px #0000000b}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5dce7;border-radius:9px;margin:8px 0;font:inherit}textarea{min-height:100px}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:700}.stats,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid{grid-template-columns:1fr 1fr}.stat{background:#f8fafc;padding:12px;border-radius:9px}.stat b{display:block;font-size:20px}.event{padding:12px;border-bottom:1px solid #edf0f4}.event p,.comment p{white-space:pre-wrap;color:#657287}.comment{border-left:4px solid #f59e0b;background:#fffbeb;padding:11px;margin:8px 0}.muted{color:#7b8798}@media(max-width:800px){.grid,.stats{grid-template-columns:1fr}}</style><main class="app"><p class="muted">Agent workspace · SSE workflow</p><h1>Code Review Agent <small id="status" class="muted">等待任务</small></h1><section class="card"><p class="muted">把链接、diff 或其他审查需求发送给 Agent。</p><input id="source" placeholder="发送 PR/MR 链接或其他需求"><textarea id="diff" placeholder="可选：直接粘贴 diff"></textarea><button id="send" onclick="run()">发送</button><p id="error" style="color:#c62828"></p></section><section id="dash" style="display:none"><div class="stats"><div class="stat">阶段<b id="stage">-</b></div><div class="stat">耗时<b id="duration">0 ms</b></div><div class="stat">事件<b id="events">0</b></div><div class="stat">预算<b id="cost">0 cents</b></div></div><div class="grid"><section class="card"><h2>Agent / 工具实时事件</h2><div id="timeline"></div></section><section class="card"><h2>审查评论 <span id="count"></span></h2><div id="comments"></div></section></div></section></main><script>let started;const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(j){$('dash').style.display='block';$('status').textContent=j.status;$('stage').textContent=j.status;$('events').textContent=(j.trace||[]).length;$('cost').textContent=(j.spent_cents||0)+' cents';$('duration').textContent=Date.now()-started+' ms';$('timeline').innerHTML=(j.trace||[]).map(e=>'<article class="event"><b>● '+esc(e.tool)+'</b><span class="muted"> '+esc(e.phase||'event')+' · '+(e.duration_ms||0)+'ms</span><p>'+esc(e.output||e.model_reply)+'</p></article>').join('');$('count').textContent=(j.comments||[]).length+' 条';$('comments').innerHTML=(j.comments||[]).map(c=>'<article class="comment"><b>'+esc(c.file)+':'+c.line+' · '+esc(c.severity)+' · '+esc(c.confidence)+'</b><p>'+esc(c.body)+'</p></article>').join('')||'<p class="muted">暂无评论</p>';if(j.error)$('error').textContent=j.error}async function run(){started=Date.now();$('send').disabled=true;$('error').textContent='';const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:$('source').value,diff:$('diff').value})});const j=await r.json();if(!r.ok){$('error').textContent=j.error;$('send').disabled=false;return}render(j);const stream=new EventSource('/api/reviews/'+j.id+'/events');stream.addEventListener('review',e=>{const x=JSON.parse(e.data);render(x);if(x.status==='completed'||x.status==='failed'){stream.close();$('send').disabled=false}});stream.onerror=()=>{stream.close();$('send').disabled=false;$('error').textContent='SSE 连接中断，请重试'}};</script></html>
