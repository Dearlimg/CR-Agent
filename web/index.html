<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Code Review Agent</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.shell{max-width:1180px;margin:auto;padding:28px 20px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #0000000b}input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 14px;border:1px solid #d5dce7;border-radius:9px;font:inherit}textarea{min-height:140px}button{background:#2563eb;color:white;border:0;border-radius:9px;padding:11px 18px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;padding:12px;border-radius:9px}.stat b{display:block;font-size:20px;margin-top:4px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.event{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid #edf0f4}.dot{width:10px;height:10px;background:#2563eb;border-radius:50%;margin-top:5px}.event h3{font-size:14px;margin:0}.event p{white-space:pre-wrap;color:#657287;font-size:13px;max-height:100px;overflow:auto}.comment{border-left:4px solid #f59e0b;padding:12px;background:#fffbeb;margin:10px 0}.comment.high{border-color:#ef4444;background:#fff1f2}.comment h3{font-size:14px;margin:0}.comment p{white-space:pre-wrap}.muted{color:#7b8798}.error{color:#c62828}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="shell"><p class="muted">Harness observability</p><h1>Code Review Agent <small id="status" class="muted">等待任务</small></h1><section class="card"><label>GitHub PR / GitLab MR 链接</label><input id="source" placeholder="https://github.com/org/repo/pull/1"><label>或粘贴 git diff</label><textarea id="diff" placeholder="两者都填时优先使用 diff"></textarea><button id="start" onclick="run()">开始审查</button><p id="error" class="error"></p></section><section id="dash" style="display:none"><div class="stats"><div class="stat">阶段<b id="stage">-</b></div><div class="stat">前端耗时<b id="duration">0 ms</b></div><div class="stat">事件数<b id="tools">0</b></div><div class="stat">预算<b id="cost">0 cents</b></div></div><div class="grid"><section class="card"><h2>执行轨迹</h2><div id="timeline"></div></section><section class="card"><h2>审查评论 <span id="count" class="muted"></span></h2><div id="comments"></div></section></div><p class="muted">展示可审计阶段、模型返回摘要和工具结果，不展示隐藏思维链。</p></section></div><script>let timer,started;const $=x=>document.getElementById(x);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(j){$('dash').style.display='block';$('status').textContent=j.status;$('stage').textContent=j.status;$('tools').textContent=(j.trace||[]).length;$('cost').textContent=(j.spent_cents||0)+' cents';$('duration').textContent=Date.now()-started+' ms';$('timeline').innerHTML=(j.trace||[]).map(e=>'<div class="event"><i class="dot"></i><div><h3>'+esc(e.tool)+' <span class="muted">'+esc(e.phase||'event')+'</span></h3><p>'+esc(e.output||e.model_reply)+'</p></div><span class="muted">'+(e.duration_ms||0)+' ms</span></div>').join('');$('count').textContent=(j.comments||[]).length+' 条';$('comments').innerHTML=(j.comments||[]).map(c=>'<article class="comment '+(c.severity==='high'?'high':'')+'"><h3>'+esc(c.file)+':'+c.line+' · '+esc(c.severity)+' · 置信度 '+esc(c.confidence)+'</h3><p>'+esc(c.body)+'</p></article>').join('')||'<p class="muted">暂无评论</p>';if(j.error)$('error').textContent=j.error}async function run(){clearInterval(timer);$('error').textContent='';$('start').disabled=true;started=Date.now();let r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:$('source').value,diff:$('diff').value})});let j=await r.json();if(!r.ok){$('error').textContent=j.error;$('start').disabled=false;return}render(j);timer=setInterval(async()=>{let x=await(await fetch('/api/reviews/'+j.id)).json();render(x);if(x.status==='completed'||x.status==='failed'){clearInterval(timer);$('start').disabled=false}},500)}</script></body></html>
