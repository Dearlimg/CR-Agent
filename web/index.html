<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Code Review Agent</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#f6f7fb;color:#172033}main{background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001}textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px;border:1px solid #ccd3df;border-radius:8px}button{background:#2563eb;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:16px;border-radius:8px}</style></head><body><main><h1>Code Review Agent</h1><p>输入 GitHub/GitLab 链接，或直接粘贴 git diff。</p><label>链接（可选）</label><input id="source" placeholder="https://github.com/org/repo/pull/1"><label>git diff（可选）</label><textarea id="diff" rows="12" placeholder="粘贴 diff 内容"></textarea><button onclick="run()">开始审查</button><pre id="out">等待提交…</pre></main><script>async function run(){let out=document.querySelector('#out');out.textContent='提交中…';let r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:source.value,diff:diff.value})});let j=await r.json();if(!r.ok){out.textContent=j.error;return}out.textContent='任务 '+j.id+' 已创建，轮询中…';let timer=setInterval(async()=>{let x=await (await fetch('/api/reviews/'+j.id)).json();out.textContent=JSON.stringify(x,null,2);if(x.status==='completed'||x.status==='failed')clearInterval(timer)},500)}</script></body></html>
