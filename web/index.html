<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Code Review Agent</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:14px system-ui}.shell{max-width:1100px;margin:auto;padding:28px 20px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 8px 30px #0000000b}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5dce7;border-radius:9px;margin:6px 0 10px;font:inherit}textarea{min-height:110px}button{background:#2563eb;color:#fff;border:0;padding:11px 18px;border-radius:9px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:12px;background:#f8fafc;border-radius:8px}.stat b{display:block;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.event{padding:12px;border-bottom:1px solid #edf0f4}.event h3{margin:0;font-size:14px}.event p{color:#657287;white-space:pre-wrap}.comment{border-left:4px solid #f59e0b;background:#fffbeb;padding:11px;margin:8px 0}.high{border-color:#ef4444}.muted{color:#7b8798}@media(max-width:800px){.grid,.stats{grid-template-columns:1fr}}</style><body><main class="shell"><div class="muted">Agent workspace · Workflow / ReAct</div><h1>Code Review Agent <small id="status" class="muted">等待任务</small></h1><section class="card"><div class="muted">把 PR/MR 链接发给 Agent，Agent 会自动抓取、语法检查、脱敏并进入 ReAct 审查。</div><label>发送给 Agent</label><input id="source" placeholder="https://github.com/org/repo/pull/1"><details><summary>高级输入：直接提供 git diff</summary><textarea id="diff" placeholder="两者都填时优先使用 diff"></textarea></details><button id="start" onclick="run()">发送并开始审查</button><p id="error" style="color:#c62828"></p></section><section id="dash" style="display:none"><div class="stats"><div class="stat">阶段<b id="stage">-</b></div><div class="stat">耗时<b id="duration">0 ms</b></div><div class="stat">Agent 事件<b id="events">0</b></div><div class="stat">预算<b id="cost">0 cents</b></div></div><div class="grid"><section class="card"><h2>Agent 思考与工具调用</h2><div id="timeline"></div></section><section class="card"><h2>结构化审查评论 <span id="count" class="muted"></span></h2><div id="comments"></div></section></div><p class="muted">展示可审计阶段和模型返回，不展示模型隐藏思维链。</p></section></main><script>let timer,started;const $=x=>document.getElementById(x);const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(j){$('dash').style.display='block';$('status').textContent=j.status;$('stage').textContent=j.status;$('events').textContent=(j.trace||[]).length;$('cost').textContent=(j.spent_cents||0)+' cents';$('duration').textContent=Date.now()-started+' ms';$('timeline').innerHTML=(j.trace||[]).map(e=>'<div class="event"><h3>● '+esc(e.tool)+' <span class="muted">'+esc(e.phase||'event')+' · '+(e.duration_ms||0)+' ms</span></h3><p>'+esc(e.output||e.model_reply)+'</p></div>').join('');$('count').textContent=(j.comments||[]).length+' 条';$('comments').innerHTML=(j.comments||[]).map(c=>'<article class="comment '+(c.severity==='high'?'high':'')+'"><b>'+esc(c.file)+':'+c.line+' · '+esc(c.severity)+' · '+esc(c.confidence)+'</b><p>'+esc(c.body)+'</p></article>').join('')||'<p class="muted">暂无评论</p>';if(j.error)$('error').textContent=j.error}async function run(){clearInterval(timer);$('error').textContent='';$('start').disabled=true;started=Date.now();const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:$('source').value,diff:$('diff').value})});const j=await r.json();if(!r.ok){$('error').textContent=j.error;$('start').disabled=false;return}render(j);timer=setInterval(async()=>{const x=await(await fetch('/api/reviews/'+j.id)).json();render(x);if(x.status==='completed'||x.status==='failed'){clearInterval(timer);$('start').disabled=false}},500)}</script></body></html>
